name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Job 1: Run automated tests ──────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          python -m pytest test_app.py -v

  # ── Job 2: Build Docker image (only if tests pass) ──────────
  build-docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test   # only runs if the test job passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t taskflow:v1 .

      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name taskflow-test taskflow:v1

      - name: Wait for container to start
        run: sleep 5

      - name: Health check against running container
        run: |
          curl --fail http://localhost:5000/health

      - name: Stop and remove container
        run: |
          docker stop taskflow-test
          docker rm taskflow-test
