name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Job 1: Run automated tests ──────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies   # 🚀 speeds up CI
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installed packages (debug step)
        run: pip list

      - name: Run pytest
        run: pytest -v


  # ── Job 2: Build Docker image (only if tests pass) ──────────
  build-docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t taskflow:v1 .

      - name: Run container
        run: docker run -d -p 5000:5000 --name taskflow-test taskflow:v1

      - name: Wait for container to start
        run: sleep 8   # ⏳ give Flask time to boot

      - name: Check container logs (debug)
        run: docker logs taskflow-test

      - name: Health check
        run: curl --fail http://localhost:5000/health

      - name: Cleanup container
        if: always()
        run: |
          docker stop taskflow-test || true
          docker rm taskflow-test || true
